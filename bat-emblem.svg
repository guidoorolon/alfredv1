<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" role="img" aria-label="Emblema Alfred">
  <!--
    Emblema original de murciélago para Alfred Dashboard.
    Silueta geométrica propia — NO es una reproducción de ningún logo oficial.
    Diseño: cuerpo central + alas asimétricas + orejas puntiagudas.
  -->

  <!-- Cuerpo central -->
  <path
    d="M60 72 C54 72 50 68 48 62 C44 54 44 46 46 38 C48 30 52 24 56 20 L60 16 L64 20 C68 24 72 30 74 38 C76 46 76 54 72 62 C70 68 66 72 60 72 Z"
    fill="currentColor"
  />

  <!-- Ala derecha — forma de murciélago con nervaduras -->
  <path
    d="M74 38 C80 34 88 28 98 22 C108 16 116 14 118 18 C120 22 114 28 108 34 C102 38 96 40 92 46 C88 52 88 58 84 60 C80 62 76 58 74 50 C72 44 72 40 74 38 Z"
    fill="currentColor"
    opacity="0.9"
  />

  <!-- Nervadura ala derecha -->
  <path
    d="M76 40 C82 36 94 26 110 18"
    stroke="currentColor"
    stroke-width="0.8"
    stroke-opacity="0.3"
    fill="none"
  />
  <path
    d="M78 46 C84 44 94 38 106 30"
    stroke="currentColor"
    stroke-width="0.6"
    stroke-opacity="0.25"
    fill="none"
  />

  <!-- Ala izquierda — simétrica -->
  <path
    d="M46 38 C40 34 32 28 22 22 C12 16 4 14 2 18 C0 22 6 28 12 34 C18 38 24 40 28 46 C32 52 32 58 36 60 C40 62 44 58 46 50 C48 44 48 40 46 38 Z"
    fill="currentColor"
    opacity="0.9"
  />

  <!-- Nervadura ala izquierda -->
  <path
    d="M44 40 C38 36 26 26 10 18"
    stroke="currentColor"
    stroke-width="0.8"
    stroke-opacity="0.3"
    fill="none"
  />
  <path
    d="M42 46 C36 44 26 38 14 30"
    stroke="currentColor"
    stroke-width="0.6"
    stroke-opacity="0.25"
    fill="none"
  />

  <!-- Oreja izquierda -->
  <path
    d="M54 16 L48 6 L52 14 Z"
    fill="currentColor"
    opacity="0.95"
  />

  <!-- Oreja derecha -->
  <path
    d="M66 16 L72 6 L68 14 Z"
    fill="currentColor"
    opacity="0.95"
  />

  <!-- Cola central -->
  <path
    d="M58 72 L56 78 L60 74 L64 78 L62 72 Z"
    fill="currentColor"
    opacity="0.8"
  />
</svg>
